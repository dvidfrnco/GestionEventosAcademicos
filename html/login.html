<!DOCTYPE html>
<html lang="es">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Sistema de Gestión de Eventos Académicos</title>
  <link rel="stylesheet" href="../css/global.css">
</head>


<body>

  <header>
    <div class="marca">
      <span>Sistema de Eventos Académicos</span>
    </div>


    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Eventos</a></li>
        <li><a href="login.html" aria-current="page">Iniciar sesión</a></li>
        <li><a href="participante.html">Mi agenda</a></li>
        <li><a href="admin.html">Administración</a></li>
      </ul>
    </nav>

    <div class="sesion">
      <span id="nombre-usuario"></span>
      <button type="button" id="btn-salir">Cerrar sesión</button>
    </div>
  </header>

 
  <main>

    <section id="acceso">

      <div id="encabezado-acceso">
        <h1>Iniciar sesión</h1>
        <p>Accede con tu cuenta para inscribirte a eventos.</p>
      </div>


      <nav id="pestanas-acceso" role="tablist" aria-label="Tipo de acceso">

        <button role="tab" id="tab-iniciar-sesion" aria-selected="true" aria-controls="panel-iniciar-sesion" type="button">
          Iniciar sesión
        </button>

        <button role="tab" id="tab-registro" aria-selected="false" aria-controls="panel-registro" type="button">
          Crear cuenta
        </button>

      </nav>


      <section id="panel-iniciar-sesion" role="tabpanel" aria-labelledby="tab-iniciar-sesion">
        <form id="form-iniciar-sesion" novalidate>

          <div class="campo">
            <label for="correo-inicio">Correo electrónico</label>
            <input type="email" id="correo-inicio" name="correo" required autocomplete="email">
            <span class="error" id="error-correo-inicio"></span>
          </div>

          <div class="campo">
            <label for="password-inicio">Contraseña</label>
            <input type="password" id="password-inicio" name="password" required autocomplete="current-password">
            <span class="error" id="error-password-inicio"></span>
          </div>

          <p id="mensaje-error-inicio" role="alert" hidden></p>

          <button type="submit">Iniciar sesión</button>
        </form>
      </section>

 

      <section id="panel-registro" role="tabpanel" aria-labelledby="tab-registro" hidden>
        <form id="form-registro" novalidate>

          <div class="campo">
            <label for="nombre-registro">Nombre completo</label>
            <input type="text" id="nombre-registro" name="nombre" required autocomplete="name">
            <span class="error" id="error-nombre-registro"></span>
          </div>

          <div class="campo">
            <label for="correo-registro">Correo electrónico</label>
            <input type="email" id="correo-registro" name="correo" required autocomplete="email">
            <span class="error" id="error-correo-registro"></span>
          </div>

          <div class="campo">
            <label for="password-registro">Contraseña</label>
            <input type="password" id="password-registro" name="password" required autocomplete="new-password">
            <span class="error" id="error-password-registro"></span>
          </div>

          <div class="campo">
            <label for="password-confirmar">Confirmar contraseña</label>
            <input type="password" id="password-confirmar" name="passwordConfirmar" required autocomplete="new-password">
            <span class="error" id="error-password-confirmar"></span>
          </div>

          <p id="mensaje-error-registro" role="alert" hidden></p>

          <button type="submit">Crear cuenta</button>
        </form>
      </section>

    </section>

  </main>


  <footer>
    <p>Sistema de Gestión de Eventos Académicos - UNIAJC</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
